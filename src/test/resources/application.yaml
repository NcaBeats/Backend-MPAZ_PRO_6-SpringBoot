spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

mpaz:
  seed:
    enabled: true
  auth:
    jwt:
      secret: "test-secret-with-at-least-32-bytes-0123456789"
      expiration-seconds: 3600

logging:
  level:
    org.hibernate.SQL: warn
