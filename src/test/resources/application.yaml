spring:
  datasource:
    # Base en memoria compartida: una sola conexion (pool 1) mantiene viva la
    # base mientras corre el contexto de Spring.
    url: jdbc:sqlite:file:mpaz-test?mode=memory&cache=shared&foreign_keys=on&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

mpaz:
  seed:
    enabled: true
  auth:
    jwt:
      secret: "test-jwt-secret-change-me-0123456789abcdef"
      expiration-seconds: 3600
