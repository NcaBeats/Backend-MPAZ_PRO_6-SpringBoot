spring:
  application:
    name: MPAZ_PRO_6-SpringBoot
  config:
    import: optional:file:.env[.properties]

  datasource:
    # SQLite: base de datos embebida en un archivo local. No requiere servidor.
    # foreign_keys=on activa las FK (incluidas las compuestas de la seccion 4 de la
    # especificacion); SQLite las ignora por defecto en cada conexion.
    # busy_timeout evita SQLITE_BUSY si coinciden dos escrituras.
    url: jdbc:sqlite:${SQLITE_PATH:./data/mpaz.db}?foreign_keys=on&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite admite un solo escritor; serializar el acceso simplifica la demo.
      maximum-pool-size: 1

  jpa:
    hibernate:
      # El esquema lo gobierna Flyway (V1__esquema.sql). SQLite usa tipado
      # dinamico, por lo que "validate" produce falsos negativos.
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Datos de demo: el DataInitializer llena la base la primera vez.
# Poner false para arrancar con la base vacia.
mpaz:
  seed:
    enabled: true
  auth:
    jwt:
      # Secreto HS256 solo para la demo. Debe cambiarse en un entorno real.
      secret: "mpaz-pro-6-demo-jwt-secret-change-me-0123456789abcdef"
      # Vigencia del token emitido por POST /api/auth/login, en segundos.
      expiration-seconds: 3600

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: DEBUG
