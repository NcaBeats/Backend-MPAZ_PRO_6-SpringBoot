spring:
  application:
    name: MPAZ_PRO_6-SpringBoot
  config:
    import: optional:file:.env[.properties]

  datasource:
    # PostgreSQL es la fuente de verdad. Para desarrollo local, levantar el
    # servicio con `docker compose up -d` (ver compose.yaml).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mpaz}
    username: ${POSTGRES_USER:mpaz}
    password: ${POSTGRES_PASSWORD:mpaz}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # El esquema lo gobierna Flyway (V1__esquema.sql).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Datos de demo: el DataInitializer llena la base la primera vez.
# Poner false para arrancar con la base vacia.
mpaz:
  seed:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    # La app Android usa el mensaje; nunca exponer stack traces al cliente.
    include-message: always
    include-stacktrace: never

logging:
  level:
    org.hibernate.SQL: DEBUG
