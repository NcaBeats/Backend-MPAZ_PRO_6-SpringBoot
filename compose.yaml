services:
  postgres:
    image: 'postgres:17'
    container_name: mpaz-postgres
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-mpaz}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}'
      - 'POSTGRES_USER=${POSTGRES_USER:-mpaz}'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mpaz} -d ${POSTGRES_DB:-mpaz}' ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
